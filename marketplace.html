
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | UNIVRSE</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/marketplace.css">
</head>

<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">✦ UNIVRSE</h2>

      <nav>
        <a href="dashboard.html">Home</a>
        <a href="schedule.html">Schedule</a>
        <a href="assignments.html">Assignments</a>
        <a href="attendance.html">Attendance</a>
        <a href="clubs.html">Campus</a>
        <a href="marketplace.html" class="active">Marketplace</a>
      </nav>

      <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
      <br><br><br><br><br><br><br><br>

      <div class="sidebar-bottom">
        <a href="#">Settings</a>
        <p>Aarush</p>
        <small>B.Tech CSE · Semester 1</small>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Top Bar -->
      <header class="topbar">
        <input type="text" class="topbar-search" placeholder="Search Univrse...">
        <div class="topbar-right">
          <span class="bell">🔔</span>
          <span class="avatar">AR</span>
        </div>
      </header>

      <!-- Page Heading -->
      <section class="page-heading">
        <h1>Marketplace</h1>
        <p>Buy and sell with people on your campus.</p>
      </section>

      <!-- Search and Filters -->
      <section class="marketplace-toolbar">
       <div class="search-container">
  <input
    type="text"
    class="marketplace-search"
    placeholder="Search books, electronics, cycles..."
  >
  <button type="button" id="clear-search">Clear</button>
</div>
        <select id="price-sort">
          <option value="default">Sort by Price</option>
          <option value="low-high">Price: Low to High</option>
          <option value="high-low">Price: High to Low</option>
          <option value="newest">Newest Listings</option>
        </select>

        <select id="condition-filter">
          <option value="All">All Conditions</option>
          <option value="New">New</option>
          <option value="Like New">Like New</option>
          <option value="Good">Good</option>
          <option value="Used">Used</option>
        </select>

        <button class="sell-btn">+ Sell an item</button>
        <button type="button" id="reset-filters">Reset Filters</button>

        <!-- Sell Form -->
        <div id="sell-form-container" style="display: none;">
          <h2>Sell an Item</h2>

          <form id="sell-form">
            <input name="name" placeholder="Product name" required>

            <input
              name="price"
              type="number"
              min="1"
              placeholder="Price in ₹"
              required
            >

            <select name="category" required>
              <option value="">Choose category</option>
              <option>Books</option>
              <option>Electronics</option>
              <option>Calculators</option>
              <option>Cycles</option>
              <option>Accessories</option>
              <option>Furniture</option>
            </select>

            <select name="condition" required>
              <option value="">Choose condition</option>
              <option>New</option>
              <option>Like New</option>
              <option>Good</option>
              <option>Used</option>
            </select>

            <input name="location" placeholder="Pickup location" required>
            <input name="seller" placeholder="Your name" required>

            <button type="submit">Add Listing</button>
            <button type="button" id="cancel-sell">Cancel</button>
          </form>

          <p id="sell-message"></p>
        </div>
      </section>

      <!-- Category Filters -->
      <section class="categories">
        <button class="category-chip active">All</button>
        <button class="category-chip">Books</button>
        <button class="category-chip">Electronics</button>
        <button class="category-chip">Calculators</button>
        <button class="category-chip">Cycles</button>
        <button class="category-chip">Accessories</button>
        <button class="category-chip">Furniture</button>
      </section>

      <!-- Products are rendered by marketplace.js from data/products.json -->
      <p id="product-count" aria-live="polite"></p>
<section class="product-grid"></section>

    </main>
  </div>

  <script src="js/marketplace.js"></script>
</body>
</html>
