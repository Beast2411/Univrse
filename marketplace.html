<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univrse | Campus Marketplace</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Univrse</h2>
        <span>Campus Hub</span>
      </div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="schedule.html" class="nav-link">Schedule</a>
        <a href="assignments.html" class="nav-link">Assignments</a>
        <a href="attendance.html" class="nav-link">Attendance</a>
        <a href="marketplace.html" class="nav-link active" aria-current="page">Marketplace</a>
        <a href="clubs.html" class="nav-link">Clubs &amp; Events</a>
        <a href="helpdesk.html" class="nav-link">Help Desk</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="marketplace-header">
        <div>
          <h1>Campus Marketplace</h1>
          <p>Buy, sell, and discover essentials across campus.</p>
        </div>

        <button type="button" id="open-sell-btn" class="sell-btn">
          + Sell an item
        </button>
      </header>

      <!-- Feedback Banner -->
      <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden></div>

      <!-- Search, Filters & Sort Controls -->
      <section class="marketplace-controls" aria-label="Filter and sort listings">
        <div class="search-row">
          <div class="search-input-wrap">
            <input
              type="search"
              class="marketplace-search"
              placeholder="Search items by name or campus location..."
              aria-label="Search marketplace items"
            >
            <button type="button" id="clear-search" class="clear-search-btn" aria-label="Clear search">
              Clear
            </button>
          </div>

          <div class="filter-selects">
            <select id="status-filter" aria-label="Filter by availability status">
              <option value="All">All Statuses</option>
              <option value="Available">Available</option>
              <option value="Sold">Sold</option>
            </select>

            <select id="price-sort" aria-label="Sort by price">
              <option value="default">Sort: Featured</option>
              <option value="low-high">Price: Low to High</option>
              <option value="high-low">Price: High to Low</option>
            </select>

            <button type="button" id="reset-filters" class="reset-filters-btn">
              Reset
            </button>
          </div>
        </div>

        <!-- Category Chips (Matches API_CONTRACT.md) -->
        <div class="category-bar" role="group" aria-label="Filter by category">
          <button type="button" class="category-chip active" data-category="All">All</button>
          <button type="button" class="category-chip" data-category="Books">Books</button>
          <button type="button" class="category-chip" data-category="Electronics">Electronics</button>
          <button type="button" class="category-chip" data-category="Calculators">Calculators</button>
          <button type="button" class="category-chip" data-category="Cycles">Cycles</button>
          <button type="button" class="category-chip" data-category="Accessories">Accessories</button>
          <button type="button" class="category-chip" data-category="Furniture">Furniture</button>
        </div>

        <p id="product-count" class="product-count" aria-live="polite"></p>
      </section>

      <!-- Product Listings Grid -->
      <section class="product-grid" aria-label="Marketplace listings"></section>

      <!-- Add / Edit Product Modal (POST & PUT /api/marketplace) -->
      <div id="sell-form-container" class="sell-modal-overlay" aria-hidden="true">
        <div
          class="sell-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="sell-modal-title"
        >
          <div class="sell-modal-header">
            <div>
              <h2 id="sell-modal-title">Sell an Item</h2>
              <p id="sell-modal-subtitle">List your item for other students to discover.</p>
            </div>

            <button
              type="button"
              id="close-sell"
              class="sell-modal-close"
              aria-label="Close product form"
            >&times;</button>
          </div>

          <form id="sell-form">
            <input type="hidden" id="product-id" name="id">

            <div class="sell-form-field">
              <label for="product-name">Product name *</label>
              <input
                type="text"
                id="product-name"
                name="name"
                placeholder="e.g. Scientific Calculator"
                required
              >
            </div>

            <div class="sell-form-field">
              <label for="product-price">Price (&#8377;) *</label>
              <input
                type="number"
                id="product-price"
                name="price"
                min="0"
                step="1"
                placeholder="e.g. 600"
                required
              >
            </div>

            <div class="sell-form-field">
              <label for="product-category">Category *</label>
              <select id="product-category" name="category" required>
                <option value="">Choose category</option>
                <option value="Books">Books</option>
                <option value="Electronics">Electronics</option>
                <option value="Calculators">Calculators</option>
                <option value="Cycles">Cycles</option>
                <option value="Accessories">Accessories</option>
                <option value="Furniture">Furniture</option>
              </select>
            </div>

            <div class="sell-form-field">
              <label for="product-condition">Condition *</label>
              <select id="product-condition" name="condition" required>
                <option value="New">New</option>
                <option value="Like New">Like New</option>
                <option value="Good" selected>Good</option>
                <option value="Used">Used</option>
              </select>
            </div>

            <div class="sell-form-field">
              <label for="product-location">Campus Location *</label>
              <input
                type="text"
                id="product-location"
                name="location"
                placeholder="e.g. Hostel Block C / Library"
                required
              >
            </div>

            <div class="sell-form-field">
              <label for="seller-name">Seller name *</label>
              <input
                type="text"
                id="seller-name"
                name="seller"
                placeholder="e.g. Riya M."
                required
              >
            </div>

            <div class="sell-form-field">
              <label for="product-status">Status *</label>
              <select id="product-status" name="status" required>
                <option value="Available">Available</option>
                <option value="Sold">Sold</option>
              </select>
            </div>

            <div class="sell-form-field">
              <label for="product-image">Image Path / URL (Optional)</label>
              <input
                type="text"
                id="product-image"
                name="image"
                placeholder="images/bookss.jpg or https://..."
              >
            </div>

            <p id="sell-message" role="status" aria-live="polite"></p>

            <div class="sell-modal-actions">
              <button type="button" id="cancel-sell">Cancel</button>
              <button type="submit" id="submit-product-btn" class="sell-btn">Add Listing</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Product Details Modal (uses GET /api/marketplace/:id) -->
      <div id="detail-modal-overlay" class="sell-modal-overlay" aria-hidden="true">
        <div
          class="sell-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="detail-modal-title"
        >
          <div class="sell-modal-header">
            <div>
              <h2 id="detail-modal-title">Product Details</h2>
              <p id="detail-modal-category"></p>
            </div>
            <button
              type="button"
              id="close-detail"
              class="sell-modal-close"
              aria-label="Close product details"
            >&times;</button>
          </div>
          <div id="detail-modal-body" class="detail-modal-body"></div>
        </div>
      </div>
    </main>
  </div>

  <button id="back-to-top" type="button" aria-label="Back to top">
    Back to top
  </button>

  <script src="js/theme.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
